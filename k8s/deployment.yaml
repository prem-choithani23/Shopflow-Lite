apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopflow
  template:
    metadata:
      labels:
        app: shopflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      containers:
      - name: shopflow
        image: shopflow:metrics
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: shopflow-secret
              key: SUPABASE_URL
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: shopflow-secret
              key: SUPABASE_KEY
